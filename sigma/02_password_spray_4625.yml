title: Windows Logon Failures - Possible Password Spray
status: experimental
description: Failed logons (4625) from one source against many different accounts. Distinct-user correlation is done in Wazuh rule 100102.
author: Salman Sainudeen
date: 2026-11-25
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType:
            - 3
            - 10
    condition: selection
falsepositives:
    - Shared jump hosts or VPN gateways where many users fail at once.
level: medium
